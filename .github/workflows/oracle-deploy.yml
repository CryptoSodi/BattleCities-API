name: Test and deploy Oracle API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active deployment running to completion. Newer queued pushes replace older ones.
concurrency:
  group: oracle-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: battlecities_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecities_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate the isolated CI database
        run: npm run db:migrate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/battlecities_test
          BATTLECITY_DATABASE_SSL: disable
      - name: Run all tests, including PostgreSQL integration
        run: npm test
        env:
          NODE_ENV: test
          BATTLECITY_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/battlecities_test
          BATTLECITY_DATABASE_SSL: disable
      - run: npm run smoke:local

  deploy:
    name: Deploy api.battlecities.com
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer push will deploy the latest main commit.'
          fi
      - name: Configure the dedicated deployment connection
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_API_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_API_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/oracle-api-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/oracle-api-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/oracle-api-ssh/known_hosts"
      - name: Upload and deploy the committed release
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.ORACLE_API_HOST }}
          DEPLOY_USER: ${{ vars.ORACLE_API_USER }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/api-$GITHUB_SHA.tar"
          git archive --format=tar --output="$archive" "$GITHUB_SHA"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          ssh -T -i "$RUNNER_TEMP/oracle-api-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/oracle-api-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $checksum" < "$archive"
          curl --fail --silent --show-error --retry 3 https://api.battlecities.com/api/health
          curl --fail --silent --show-error --retry 3 https://api.battlecities.com/api/ready
          echo "Deployed $GITHUB_SHA to https://api.battlecities.com" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment credentials from the runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/oracle-api-ssh/key" "$RUNNER_TEMP/oracle-api-ssh/known_hosts"
